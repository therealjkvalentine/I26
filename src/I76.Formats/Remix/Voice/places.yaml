# What a node table's place is, in the words a spoken line can say (docs/remix-missions.md "Spoken lines"), written by hand
# from the tables' own descriptions: a place is tagged only when it IS that kind of place ("the Pecos bridge on 380"), never
# when it is beside or near one ("the riverbed north of the bridge"). Keys are a table's start, node, cluster or route names
# (a route's tag is its end's). "on 380": on that road.
